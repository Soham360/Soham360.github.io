<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fbfbfd">
  <title>Soham Kamat — Mechanical Engineering</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

  <div id="nav"></div>
  <div id="hero"></div>
  <div id="about"></div>
  <div id="projects"></div>
  <div id="education"></div>
  <div id="experience"></div>
  <div id="skills"></div>
  <div id="leadership"></div>
  <div id="honors"></div>
  <div id="contact"></div>
  <div id="footer"></div>

  <script>
    const includes = [
      { id: 'nav', file: 'partials/nav.html' },
      { id: 'hero', file: 'partials/hero.html' },
      { id: 'about', file: 'partials/about.html' },
      { id: 'projects', file: 'partials/projects.html' },
      { id: 'education', file: 'partials/education.html' },
      { id: 'experience', file: 'partials/experience.html' },
      { id: 'skills', file: 'partials/skills.html' },
      { id: 'leadership', file: 'partials/leadership.html' },
      { id: 'honors', file: 'partials/honors.html' },
      { id: 'contact', file: 'partials/contact.html' },
      { id: 'footer', file: 'partials/footer.html' }
    ];

    const scrollBehavior =
      window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

    // One scroll, no retries. scroll-padding-top in the CSS handles the nav offset.
    function scrollToSection(sectionId) {
      if (sectionId === 'top') {
        window.scrollTo({ top: 0, behavior: scrollBehavior });
        return;
      }
      const target = document.getElementById(sectionId);
      if (target) target.scrollIntoView({ behavior: scrollBehavior, block: 'start' });
    }

    // Delegated, because the nav is injected after load.
    document.addEventListener('click', function (e) {
      // Brand mark: scroll to top instead of reloading
      if (e.target.closest('.brand')) {
        e.preventDefault();
        scrollToSection('top');
        return;
      }

      // In-page nav links: scroll without adding '#' to the address bar
      const anchor = e.target.closest('.nav-links a[href*="#"]');
      if (!anchor) return;
      const targetId = anchor.getAttribute('href').split('#')[1];
      if (targetId) {
        e.preventDefault();
        scrollToSection(targetId);
      }
    });

    // Load all HTML partials; one failed fetch no longer blocks the rest
    Promise.all(
      includes.map(item =>
        fetch(item.file)
          .then(res => (res.ok ? res.text() : ''))
          .then(data => {
            const container = document.getElementById(item.id);
            if (container && data) container.outerHTML = data;
          })
          .catch(() => {})
      )
    ).then(() => {
      window.__partialsLoaded = true;
      document.dispatchEvent(new Event('partials:loaded'));

      // Arriving from a project page: scroll to the section it asked for
      const pendingSection = sessionStorage.getItem('scrollToSection');
      if (pendingSection) {
        sessionStorage.removeItem('scrollToSection');
        scrollToSection(pendingSection);
      }
    });
  </script>
  <script src="assets/js/main.js"></script>
</body>
</html>
