<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soham Kamat — Mechanical Engineering</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

  <div id="nav"></div>
  <div id="hero"></div>
  <div id="about"></div>
  <div id="education"></div>
  <div id="experience"></div>
  <div id="projects"></div>
  <div id="skills"></div>
  <div id="leadership"></div>
  <div id="honors"></div>
  <div id="contact"></div>
  <div id="footer"></div>

  <script>
    const includes = [
      { id: 'nav', file: 'partials/nav.html' },
      { id: 'hero', file: 'partials/hero.html' },
      { id: 'about', file: 'partials/about.html' },
      { id: 'education', file: 'partials/education.html' },
      { id: 'experience', file: 'partials/experience.html' },
      { id: 'projects', file: 'partials/projects.html' },
      { id: 'skills', file: 'partials/skills.html' },
      { id: 'leadership', file: 'partials/leadership.html' },
      { id: 'honors', file: 'partials/honors.html' },
      { id: 'contact', file: 'partials/contact.html' },
      { id: 'footer', file: 'partials/footer.html' }
    ];

    // Helper function to scroll to a section reliably
    function scrollToSection(sectionId) {
      const target = document.getElementById(sectionId);
      if (!target) return;

      let attempts = 0;
      const scroll = () => {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        attempts++;
        if (attempts < 3) {
          setTimeout(scroll, 200);
        }
      };
      setTimeout(scroll, 100);
    }

    // Load all HTML partials asynchronously
    Promise.all(
      includes.map(item =>
        fetch(item.file)
          .then(res => res.text())
          .then(data => {
            const container = document.getElementById(item.id);
            if (container) {
              container.outerHTML = data;
            }
          })
      )
    ).then(() => {
      // 1. Check for stored section target from sub-pages
      const pendingSection = sessionStorage.getItem('scrollToSection');
      if (pendingSection) {
        sessionStorage.removeItem('scrollToSection');
        scrollToSection(pendingSection);
      }

      // 2. Attach click listeners to dynamically injected navbar links
      document.querySelectorAll('.nav-links a[href*="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          const href = this.getAttribute('href');
          const targetId = href.split('#')[1];

          if (targetId) {
            e.preventDefault();
            scrollToSection(targetId);

            // Keep address bar clean without adding '#'
            if (window.location.hash) {
              history.replaceState(null, null, window.location.pathname);
            }
          }
        });
      });
    });
  </script>
  <script src="assets/js/main.js"></script>
</body>
</html>
