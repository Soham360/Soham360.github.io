# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Profile picture: if a photo is in assets/img/source/, cut out the
      # background and write assets/img/ProfilePic.png before deploying.
      - name: Set up Python
        if: ${{ hashFiles('assets/img/source/*') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Cache background-removal model
        if: ${{ hashFiles('assets/img/source/*') != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-models-v1
      - name: Remove profile picture background
        if: ${{ hashFiles('assets/img/source/*') != '' }}
        run: |
          pip install -r scripts/requirements.txt
          python scripts/remove_bg.py
          # Keep the original (with its background) out of the deployed site
          rm -rf assets/img/source

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
